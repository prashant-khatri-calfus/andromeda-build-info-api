apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: build-info

labels:
  - pairs:
      app.kubernetes.io/name: build-info-api
      app.kubernetes.io/part-of: build-info
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: build-info-api-config
    literals:
      - ENVIRONMENT=base
      - LOG_LEVEL=INFO
