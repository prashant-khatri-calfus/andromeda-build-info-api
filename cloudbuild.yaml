# CI/CD: test -> build -> push -> deploy (by digest) -> verify.
# Triggered on push to main (terraform/cloudbuild.tf) or manually via `make deploy`.

substitutions:
  _REGION: asia-south1
  _CLUSTER: build-info-dev
  _REPO: build-info-images
  _ENVIRONMENT: dev
  _IMAGE_NAME: build-info-api
  # Populated automatically by a trigger; overridden by `make deploy` for manual runs.
  _GIT_COMMIT: ${SHORT_SHA}
  _GIT_BRANCH: ${BRANCH_NAME}

options:
  dynamic_substitutions: true
  substitution_option: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY # required when running as a user-managed SA
  machineType: E2_HIGHCPU_8

timeout: 1200s

steps:
  # 1. Unit tests + lint. Fail fast before anything is built.
  - id: test
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm ci --no-audit --no-fund
        npm run lint
        npm test
        npm audit --omit=dev --audit-level=high

  # 2. Build, baking build metadata into the image (as env vars).
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"
        docker build \
          --build-arg APP_VERSION="$$(cat VERSION)" \
          --build-arg GIT_COMMIT="${_GIT_COMMIT}" \
          --build-arg GIT_BRANCH="${_GIT_BRANCH}" \
          --build-arg BUILD_TIME="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --build-arg BUILD_ID="${BUILD_ID}" \
          -t "$${IMAGE}:${_GIT_COMMIT}" \
          -t "$${IMAGE}:$$(cat VERSION)-${_GIT_COMMIT}" \
          .

  # 3. Push and record the immutable digest for deployment.
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"
        docker push --all-tags "$${IMAGE}"
        docker inspect --format='{{index .RepoDigests 0}}' "$${IMAGE}:${_GIT_COMMIT}" \
          | cut -d@ -f2 > /workspace/digest.txt
        echo "Pushed $${IMAGE}@$$(cat /workspace/digest.txt)"

  # 4. Deploy the exact digest just built (tags are mutable; digests are not).
  #    Connects through the cluster's IAM-authenticated DNS endpoint, so the
  #    private cluster needs no public IP endpoint or private worker pool.
  - id: deploy
    # ":latest" is the full image with kubectl + gke-gcloud-auth-plugin
    # (":stable" ships gcloud only). Pin a version tag for production.
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE_NAME}"
        gcloud container clusters get-credentials "${_CLUSTER}" \
          --region "${_REGION}" --project "${PROJECT_ID}" --dns-endpoint

        cd "k8s/overlays/${_ENVIRONMENT}"
        cat >> kustomization.yaml <<YAML
        images:
          - name: build-info-api
            newName: $${IMAGE}
            digest: $$(cat /workspace/digest.txt)
        YAML

        kubectl apply -k .
        kubectl -n build-info rollout status deployment/build-info-api --timeout=300s

  # 5. Post-deploy verification through the PUBLIC endpoint (what users see):
  #    the load balancer must consistently serve THIS commit. Rollout success only
  #    proves pods are healthy; this proves the right artifact is live end to end.
  #    (Uses the LB rather than `kubectl exec`, which depends on the control-plane
  #    tunnel to brand-new Autopilot nodes and can fail right after scale-up.)
  - id: verify
    # ":latest" is the full image with kubectl + gke-gcloud-auth-plugin
    # (":stable" ships gcloud only). Pin a version tag for production.
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials "${_CLUSTER}" \
          --region "${_REGION}" --project "${PROJECT_ID}" --dns-endpoint

        IP=""
        for i in $$(seq 1 30); do
          IP=$$(kubectl -n build-info get svc build-info-api \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          [ -n "$${IP}" ] && break
          echo "waiting for external IP..."; sleep 10
        done
        [ -n "$${IP}" ] || { echo "Service has no external IP"; exit 1; }
        URL="http://$${IP}/build-info"

        # Require 5 consecutive responses with this commit (LB may need a minute
        # on first deploy; old pods drain during this window).
        OK=0; BODY=""
        for i in $$(seq 1 60); do
          BODY=$$(curl -fsS --max-time 5 "$${URL}" || true)
          if echo "$${BODY}" | grep -q "\"git_commit\":\"${_GIT_COMMIT}\""; then
            OK=$$((OK + 1))
          else
            OK=0
          fi
          if [ "$${OK}" -ge 5 ]; then
            echo "Verified: $${URL} serves commit ${_GIT_COMMIT}"
            echo "$${BODY}"
            exit 0
          fi
          sleep 5
        done
        echo "Endpoint did not consistently report ${_GIT_COMMIT}. Last response: $${BODY}"
        exit 1
